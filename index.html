<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DY-CRM系统 · 医疗营销数据驾驶舱</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d6fe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DY-CRM">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --sidebar-bg:#101c2e; --sidebar-active:#1d6fe0; --sidebar-text:#9fb0c7;
    --bg:#f2f5fa; --card:#ffffff; --line:#e6ebf2;
    --txt:#1f2d3d; --txt2:#8492a6;
    --blue:#1d6fe0; --red:#e64545; --green:#18a058; --orange:#e6a23c; --teal:#0e9f9f;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;}
  svg{display:block;}
  .layout{display:flex;min-height:100vh;}

  /* ============ 侧边栏 ============ */
  .sidebar{width:208px;background:var(--sidebar-bg);color:var(--sidebar-text);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .logo{display:flex;align-items:center;gap:10px;padding:18px 16px;color:#fff;font-size:16px;font-weight:700;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.06);}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1d6fe0,#0e9f9f);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nav{flex:1;padding:10px 8px;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:14px;color:var(--sidebar-text);transition:.15s;user-select:none;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#dbe6f5;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .sidebar-foot{padding:14px 16px;font-size:12px;color:#5b6b82;border-top:1px solid rgba(255,255,255,.06);}
  .sidebar-foot b{color:#9fb0c7;}

  /* ============ 主区域 ============ */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
  .topbar .title{font-size:17px;font-weight:700;}
  .topbar .spacer{flex:1;}
  .clock{font-size:15px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#1d6fe0,#0e9f9f);padding:6px 14px;border-radius:20px;box-shadow:0 2px 8px rgba(29,111,224,.25);}
  .user-badge{background:#eaf2ff;color:var(--blue);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--txt);transition:.15s;min-height:36px;}
  .btn:hover{border-color:var(--blue);color:var(--blue);}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.primary:hover{background:#1559b8;}
  .btn.danger{color:var(--red);}
  .btn.danger:hover{border-color:var(--red);}
  .content{padding:20px 22px;max-width:1440px;width:100%;margin:0 auto;}

  .sec-title{font-size:14px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
  .sec-title .dot{width:8px;height:8px;border-radius:2px;background:var(--red);display:inline-block;}
  .sec-title .dot.blue{background:var(--blue);}
  .sec-title .meta{font-size:12px;color:var(--txt2);font-weight:400;}
  .sec-title .tg-btn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;color:var(--txt2);cursor:pointer;font-weight:400;font-family:inherit;}
  .sec-title .tg-btn:hover{border-color:var(--blue);color:var(--blue);}
  .tg-edit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:6px;}
  .tg-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .tg-field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--txt2);}
  .tg-field input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;font-weight:700;color:var(--txt);width:100%;box-sizing:border-box;font-family:inherit;}
  .tg-field input:focus{outline:none;border-color:var(--blue);}
  .tg-acts{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .tg-acts .btn{padding:6px 14px;min-height:32px;font-size:12px;}
  .tg-note{font-size:11px;color:var(--txt2);}

  /* 每日一言横幅 */
  @keyframes quoteIn{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:none;}}
  @keyframes quoteFlip{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
  .quote-banner{background:linear-gradient(110deg,#1d6fe0,#0e9f9f);border-radius:var(--radius);padding:20px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:8px;box-shadow:0 6px 20px rgba(29,111,224,.20);overflow:hidden;position:relative;animation:quoteIn .7s ease both;}
  .quote-banner:before{content:"";position:absolute;right:-26px;top:-34px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10);}
  .quote-banner:after{content:"";position:absolute;right:48px;bottom:-46px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.07);}
  .quote-banner .q-text{font-size:20px;font-weight:700;letter-spacing:1px;line-height:1.55;text-shadow:0 1px 3px rgba(0,0,0,.14);position:relative;z-index:1;}
  .quote-banner .q-text.q-anim{animation:quoteFlip .45s ease both;}
  .quote-banner .q-text:before{content:"\201C";font-size:30px;opacity:.55;margin-right:2px;vertical-align:-4px;}
  .quote-banner .q-text:after{content:"\201D";font-size:30px;opacity:.55;margin-left:2px;vertical-align:-9px;}
  .quote-banner .q-meta{text-align:right;flex-shrink:0;font-size:12px;opacity:.95;line-height:1.7;position:relative;z-index:1;}
  .quote-banner .q-meta .q-src{font-size:13px;font-weight:600;}
  .quote-banner .q-meta .q-date{margin-top:3px;}
  .quote-banner .q-flip{margin-top:9px;display:inline-block;cursor:pointer;font-size:12px;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:16px;padding:4px 13px;transition:.15s;user-select:none;}
  .quote-banner .q-flip:hover{background:rgba(255,255,255,.32);transform:translateY(-1px);}
  @media (max-width:900px){ .quote-banner{flex-direction:column;align-items:flex-start;gap:10px;padding:16px 18px;} .quote-banner .q-meta{text-align:left;} .quote-banner .q-text{font-size:17px;} .quote-banner .q-flip{margin-top:6px;} }

  /* KPI 卡片 */
  .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .kpi-grid.cols6{grid-template-columns:repeat(6,1fr);}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:.15s;position:relative;}
  .kpi:hover{box-shadow:0 4px 14px rgba(29,111,224,.12);transform:translateY(-2px);border-color:#c8dcff;}
  .kpi .label{font-size:12px;color:var(--txt2);display:flex;justify-content:space-between;align-items:center;}
  .kpi .label .arrow{width:14px;height:14px;opacity:.4;}
  .kpi .value{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  .kpi .value small{font-size:13px;font-weight:500;color:var(--txt2);margin-left:2px;}
  .kpi .delta{font-size:11px;margin-top:5px;font-weight:600;line-height:1.2;}
  .kpi .delta.up{color:var(--green);}
  .kpi .delta.down{color:var(--red);}
  .kpi .delta.flat{color:var(--txt2);}
  .c-blue{color:var(--blue);} .c-red{color:var(--red);} .c-green{color:var(--green);}
  .c-orange{color:var(--orange);} .c-teal{color:var(--teal);} .c-dark{color:var(--txt);}

  /* 数据新鲜度健康条 */
  .health-bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;font-size:13px;}
  .health-bar .hb-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .health-bar .hb-dot.ok{background:var(--green);}
  .health-bar .hb-dot.warn{background:var(--orange);}
  .health-bar .hb-dot.bad{background:var(--red);}
  .health-bar .hb-txt{color:var(--txt);}
  .health-bar .hb-txt b{font-weight:700;}
  .health-bar .hb-txt.warn{color:#946200;}
  .health-bar .hb-txt.bad{color:var(--red);}
  .health-bar .hb-tag{margin-left:auto;font-size:12px;color:var(--txt2);white-space:nowrap;}
  .health-bar .hb-refresh{margin-left:12px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:12.5px;color:var(--txt);cursor:pointer;font-family:inherit;transition:.15s;}
  .health-bar .hb-refresh:hover{background:#1d6fe0;border-color:#1d6fe0;color:#fff;}

  /* 本月倒计时 + 日均缺口（常驻） */
  .gap-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;}
  .gap-bar .gap-head{font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;}
  .gap-bar .gap-head b{color:var(--blue);font-size:16px;padding:0 2px;font-variant-numeric:tabular-nums;}
  .gap-bar .gap-end{font-weight:400;color:var(--txt2);font-size:12px;margin-left:4px;}
  .gap-bar .gap-items{display:flex;flex-wrap:wrap;gap:8px;}
  .gap-bar .gap-item{font-size:12px;color:var(--txt2);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 11px;white-space:nowrap;}
  .gap-bar .gap-item b{color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums;}
  .gap-bar .gap-item.warn{background:#fff8ec;border-color:#ffe0b2;color:#946200;}
  .gap-bar .gap-item.warn b{color:#c07a00;}
  .gap-bar .gap-item.ok{background:#f0f9f2;border-color:#c8ebd3;color:var(--green);}

  /* 真异常告警区（无异常时隐藏） */
  .alert-bar{background:#fff5f5;border:1px solid #ffd9d9;border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;}
  .alert-bar .alert-head{font-size:13px;font-weight:700;color:#c0392b;margin-bottom:6px;}
  .alert-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--txt);padding:7px 0;border-top:1px solid #ffe3e3;}
  .alert-item:first-of-type{border-top:none;padding-top:2px;}
  .alert-item .alert-txt{flex:1;}
  .alert-item .alert-go{flex-shrink:0;border:1px solid #ffc9c9;background:#fff;color:#c0392b;border-radius:6px;padding:3px 12px;font-size:12px;cursor:pointer;transition:.15s;}
  .alert-item .alert-go:hover{background:#ffecec;}
  /* 提示级（黄）：轻量提醒，区别于红色告警级 */
  .alert-bar.hint{background:#fffaf0;border-color:#ffe1a8;}
  .alert-bar.hint .alert-head{color:#ad6800;}
  .alert-bar.hint .alert-item{border-top-color:#ffeecd;}
  .alert-bar.hint .alert-go{border-color:#f0d9a8;color:#ad6800;}
  .alert-bar.hint .alert-go:hover{background:#fdf0d5;}
  /* 待核查级（蓝灰）：口径/事实待核实，未到告警门槛但也解释不了 */
  .alert-bar.check{background:#f5f8fd;border-color:#cdddf3;}
  .alert-bar.check .alert-head{color:#2c5aa0;}
  .alert-bar.check .alert-item{border-top-color:#e0eaf8;}
  .alert-bar.check .alert-go{border-color:#c3d6f0;color:#2c5aa0;}
  .alert-bar.check .alert-go:hover{background:#e7f0fc;}

  /* 月度目标达成 */
  .goal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:4px;}
  .goal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .goal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .goal-name{font-size:13px;font-weight:700;}
  .goal-num{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
  .goal-num small{font-size:12px;color:var(--txt2);font-weight:500;}
  .goal-track{height:9px;background:#f0f3f8;border-radius:5px;overflow:hidden;}
  .goal-fill{height:100%;border-radius:5px;transition:width .7s cubic-bezier(.22,1,.36,1);}
  .goal-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);margin-top:7px;}
  .goal-foot .ok{color:var(--green);font-weight:700;}

  /* 图表区 */
  .chart-row{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:12px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .panel h3{font-size:14px;font-weight:700;margin-bottom:4px;}
  .panel .legend{display:flex;gap:16px;font-size:12px;color:var(--txt2);margin:4px 0 8px;}
  .legend .lg{display:flex;align-items:center;gap:5px;}
  .legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(15,25,40,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:14px;width:860px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .modal-head b{font-size:15px;}
  .modal-close{border:none;background:#f2f5fa;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--txt2);}
  .modal-close:hover{background:#e3e9f2;}
  .modal-body{padding:8px 20px 20px;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;}
  th:first-child,td:first-child{text-align:left;}
  thead th{background:#f7f9fc;color:var(--txt2);font-weight:600;position:sticky;top:0;}
  tbody tr:hover{background:#f4f8ff;}
  tfoot td{font-weight:700;background:#f7f9fc;}
  .hl{color:var(--blue);font-weight:700;}
  .hl.c-red{color:var(--red);}
  .hl.c-green{color:var(--green);}
  /* 渠道明细弹窗：本点/推出 拆分版（16列，分组表头） */
  .modal.wide{width:1280px;}
  table.mtx th,table.mtx td{padding:8px 6px;font-size:12.5px;}
  table.mtx thead tr.grp th{background:#eef2f9;color:var(--txt);font-weight:700;text-align:center;border-bottom:1px solid var(--line);}
  table.mtx thead tr.grp th.g-local{color:#0e9f9f;}
  table.mtx thead tr.grp th.g-push{color:#1d6fe0;}
  table.mtx thead tr.grp th.g-sum{color:#946200;}
  table.mtx .rate{color:var(--txt2);font-size:12px;font-weight:400;}
  table.mtx thead th.rate-h{font-weight:500;color:#8f9cae;}

  /* 数据管理 */
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;}
  .form-grid .field label{display:block;font-size:12px;color:var(--txt2);margin-bottom:4px;}
  .form-grid input,.form-grid select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;font-family:inherit;background:#fff;}
  .form-grid input:focus,.form-grid select:focus{outline:none;border-color:var(--blue);}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;}
  .table-wrap{overflow-x:auto;}
  .tip-bar{background:#fff8e6;border:1px solid #ffe1a1;color:#946200;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;}
  .tip-bar.show{display:block;}

  /* 龙虎榜 */
  .rank-list{display:flex;flex-direction:column;gap:10px;}
  .rank-item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;cursor:pointer;transition:.15s;}
  .rank-item:hover{box-shadow:0 4px 14px rgba(29,111,224,.12);transform:translateY(-1px);border-color:#c8dcff;}
  .rank-no{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;background:#f0f3f8;color:var(--txt2);flex-shrink:0;}
  .rank-item.r1 .rank-no{background:linear-gradient(135deg,#f7b500,#e64500);color:#fff;}
  .rank-item.r2 .rank-no{background:linear-gradient(135deg,#9aa7b8,#5b6b82);color:#fff;}
  .rank-item.r3 .rank-no{background:linear-gradient(135deg,#d08a4e,#8a4b1f);color:#fff;}
  .rank-name{width:80px;font-weight:700;}
  .rank-bar{flex:1;height:14px;background:#f0f3f8;border-radius:7px;overflow:hidden;}
  .rank-bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#1d6fe0,#0e9f9f);}
  .rank-num{width:110px;text-align:right;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;}

  /* 客服数据表格统一样式 */
  .cs-table{table-layout:fixed;width:100%;}
  /* 短板环节标记 */
  .weak-bad{display:inline-block;padding:1px 7px;border-radius:5px;background:#fdecea;color:#c0392b;font-weight:700;font-size:12px;white-space:nowrap;}
  .weak-bad em{font-style:normal;color:#e0695a;font-weight:600;font-size:11px;margin-left:3px;}
  .weak-ok{color:#12a150;font-weight:700;font-size:12px;white-space:nowrap;}
  .weak-none{color:#9aa7b8;font-size:12px;white-space:nowrap;}

  /* 转化漏斗分析 */
  .funnel{max-width:780px;margin:0 auto;}
  .fn-row{display:flex;align-items:center;gap:12px;}
  .fn-name{width:52px;flex-shrink:0;text-align:right;font-weight:700;font-size:14px;color:var(--txt);}
  .fn-track{flex:1;height:52px;background:#f0f3f8;border-radius:9px;overflow:hidden;display:flex;align-items:center;}
  .fn-fill{height:100%;width:0;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;color:#fff;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;transition:width .7s cubic-bezier(.22,1,.36,1);white-space:nowrap;}
  .fn-fill.fn-zero{width:46px;background:transparent;border:1px dashed #c9d2e0;color:#8492a6;font-weight:700;justify-content:flex-end;padding-right:10px;transition:none;}
  .fn-val{width:64px;flex-shrink:0;text-align:right;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;}
  .fn-pct{width:62px;flex-shrink:0;text-align:right;color:var(--txt2);font-size:13px;font-variant-numeric:tabular-nums;}
  .fn-conn{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;padding:9px 0;font-size:12.5px;color:var(--txt2);}
  .fn-conn .conv{color:var(--blue);font-weight:700;}
  .fn-conn .loss{color:#c0392b;font-weight:700;}
  .fn-summary{margin-top:18px;background:linear-gradient(135deg,#fff7f4,#fff);border:1px solid #ffd9cc;border-radius:12px;padding:14px 18px;}
  .fn-summary .ttl{font-size:13px;color:#e64500;font-weight:700;margin-bottom:6px;}
  .fn-summary p{margin:5px 0;font-size:13.5px;color:var(--txt);line-height:1.65;}
  .fn-summary b{color:var(--red);}

  .empty{padding:60px 0;text-align:center;color:var(--txt2);}
  .placeholder{padding:80px 20px;text-align:center;color:var(--txt2);}
  .placeholder b{display:block;font-size:16px;color:var(--txt);margin-bottom:8px;}

  /* ============ 移动端 ============ */
  .mobile-nav{display:none;}
  @media (max-width:900px){
    .sidebar{display:none;}

    /* 顶栏：手机上只留标题 + 时钟，收起导出/导入/徽章，避免拥挤 */
    .topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));gap:10px;}
    .topbar .spacer{display:none;}
    .topbar .btn{display:none;}
    .topbar .refresh-btn{display:inline-flex !important;align-items:center;gap:4px;}
    .topbar .user-badge{display:none;}
    .topbar .title{font-size:16px;}

    /* 底部固定 Tab 栏（App 化） */
    .mobile-nav{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
      background:var(--sidebar-bg);overflow-x:auto;overflow-y:hidden;
      padding:7px 6px calc(7px + env(safe-area-inset-bottom));gap:2px;
      box-shadow:0 -3px 14px rgba(0,0,0,.20);-webkit-overflow-scrolling:touch;
    }
    .mobile-nav .nav-item{
      flex:0 0 auto;flex-direction:column;align-items:center;justify-content:center;
      gap:3px;padding:6px 11px;margin:0;font-size:11px;line-height:1.1;color:var(--sidebar-text);
    }
    .mobile-nav .nav-item svg{width:21px;height:21px;}
    .mobile-nav .nav-item.active{background:transparent;color:#fff;}
    .mobile-nav .nav-item.active svg{color:var(--blue);}
    .mobile-nav .nav-item.active{position:relative;}
    .mobile-nav .nav-item.active::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:18px;height:3px;border-radius:2px;background:var(--blue);}
    .mobile-nav .nav-logout{display:none;}

    /* 内容让出底部 Tab 高度 */
    .content{padding:14px 14px 86px;}

    /* 栅格与组件适配 */
    .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .kpi-grid:not(.cols6) .kpi:last-child{grid-column:1/-1;}
    .goal-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .chart-row{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:repeat(2,1fr);gap:9px;}
    .kpi .value{font-size:21px;}
    .kpi .label{font-size:11px;}
    .sec-title{margin:16px 0 8px;font-size:13px;}

    /* 弹窗全屏化 */
    .mask{padding:0;}
    .modal{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0;}
    .modal-head{padding:16px 16px calc(16px + env(safe-area-inset-top));}
    .modal-body{padding:6px 14px 24px;}
    table{font-size:12px;}
    th,td{padding:9px 8px;}
  }
  @media (min-width:901px) and (max-width:1200px){
    .kpi-grid{grid-template-columns:repeat(3,1fr);}
    .goal-grid{grid-template-columns:repeat(2,1fr);}
  }

.dim{opacity:.5;text-decoration:line-through;}
</style>
</head>

function normStaff(s){ s=(s==null?'':String(s)).trim(); return STAFF.indexOf(s)>=0 ? s : null; }

/* 把一条渠道日汇总按客服权重拆成多条客服记录 */
function splitByStaff(row, rnd){
  var rows=[], acc={tot:0,val:0,push:0,book:0,arr:0};
  STAFF.forEach(function(st,si){
    var last = si===STAFF.length-1;
    var f = STAFF_W[st]*(0.85+0.3*rnd());
    var r2 = {date:row.date, org:row.org, staff:st};
    ['tot','val','push','book','arr'].forEach(function(k){
      r2[k] = last ? Math.max(0,(+row[k]||0)-acc[k]) : Math.round((+row[k]||0)*f);
      acc[k]+=r2[k];
    });
    rows.push(r2);
  });
  return rows;
}

/* 本地优先数据源：双击打开 HTML 时自动加载同目录 data.js，覆盖浏览器本地缓存（无需联网）。

function showSeedToast(v){

    document.body.appendChild(d);

function applySeedIfNewer(){
  try{
    if(typeof window.__DY_SEED__==='undefined' || !window.__DY_SEED__ || !window.__DY_SEED__.v) return false;
    var seed = window.__DY_SEED__;
    var seedVer = String(seed.v);
    /* ① 版本号一致时，仍须做「内容级校验」：
       历史版本存在「版本号已更新、但 records 还是旧数据」的脏状态
       （独立 __DY_SEED_VER__ 与 LS_KEY 分开存储导致），必须在此兜住。
       校验方式：比对本地 records 的总记录数 + 关键字段合计是否与 seed 一致。 */
    var storedVer = localStorage.getItem('__DY_SEED_VER__');
    if(storedVer === seedVer && seed.records && seed.records.length){
      var localRecords = [];
      try{ localRecords = JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ localRecords = []; }
      var sig = function(arr){
        var t = {'__n': arr.length, tot:0, val:0, push:0, book:0, arr:0};
        arr.forEach(function(r){ for(var k in t){ if(k==='__n') continue; t[k] += (+r[k]||0); } });
        return t;
      };
      var a = sig(seed.records), b = sig(localRecords);
      var same = true;
      for(var k in a){ if(a[k] !== b[k]){ same = false; break; } }
      if(same) return false;   /* 真正一致，无需覆盖 */
      /* 不一致 → 落到下面强制覆盖（脏状态修复） */
    }
    if(seed.records && seed.records.length){
      localStorage.setItem(LS_KEY, JSON.stringify(seed.records));
    }
    if(seed.cs && seed.cs.length){
      localStorage.setItem(CS_LS, JSON.stringify(seed.cs));
    }
    localStorage.setItem('__DY_SEED_VER__', seedVer);
    if(storedVer !== seedVer) showSeedToast(seedVer);
    return true;
  }catch(e){ return false; }
}

/* 缓存自检保险丝（v2，数据已内嵌）：
   页面启动时绕一切缓存拉取极小的探针文件 ver.json，
   比对「页面内嵌的数据版本 BUILD_VER」与「服务端最新版本」。
   不一致 → 说明页面本身是缓存的旧 HTML → 清空 SW 缓存 + 版本标记，带 _rc=1 强制重载一次。
   内嵌后数据与 HTML 同源，故只要 HTML 是新的，数据必然是最新的。 */
var BUILD_VER = (typeof window.__DY_SEED__ !== 'undefined' && window.__DY_SEED__ && window.__DY_SEED__.v) ? String(window.__DY_SEED__.v) : '';
function verifyDataFreshness(){
  try{
    if(!BUILD_VER) return;
    fetch('ver.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(!d || !d.v) return;
        if(String(d.v) === BUILD_VER) return;                /* 一致，页面就是最新 */
        if(location.search.indexOf('_rc=1') >= 0) return;    /* 已重载过，防死循环 */
        var done = function(){
          try{ localStorage.removeItem('__DY_SEED_VER__'); }catch(e){}
          location.replace(location.origin + location.pathname + '?_rc=1');
        };
        if('caches' in window){
          caches.keys().then(function(ks){
            return Promise.all(ks.map(function(k){ return caches.delete(k); }));
          }).then(done).catch(done);
        } else { done(); }
      }).catch(function(){ /* 离线时静默跳过 */ });
  }catch(e){}
}

function loadData(){

  if(typeof window.__DY_SEED__!=='undefined' && window.__DY_SEED__ && window.__DY_SEED__.records && window.__DY_SEED__.records.length){
    try{

        localStorage.setItem(CS_LS, JSON.stringify(window.__DY_SEED__.cs));

  }
  try{ records = JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ records = []; }

    try{

      var v4 = JSON.parse(localStorage.getItem(LS_OLD4)) || [];

                return {date:r.date,org:RENAME[r.org]||r.org,tot:tot,val:val,push:push,book:+r.hx||0,arr:+r.ry||0};
              });
            }
          }

        if(v3.length){
          var rnd = seeded(42);

            splitByStaff(r, rnd).forEach(function(row){ records.push(row); });

  if(typeof window.__DY_SEED__!=='undefined' && window.__DY_SEED__ && window.__DY_SEED__.v){
    DATA_VERSION = window.__DY_SEED__.v;
  }
}

/* 从云端数据源拉取最新数据（公开读取地址，无需密钥）；失败则保留本地缓存/示例 */
async function pullCloud(){
  if(!DATA_URL || DATA_URL.indexOf('__GIST__')===0) return;
  if(localStorage.getItem('__DY_SEED_VER__')){ CLOUD_STATUS='local'; return; } /* 已用本地 data.js，避免云端旧数据回灌 */
  try{
    var url = DATA_URL + (DATA_URL.indexOf('?')>=0 ? '&' : '?') + 't=' + Date.now();
    var res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('http '+res.status);
    var d = await res.json();
    var changed = false;
    if(d.records && d.records.length){
      records = normRecords(d.records.map(function(r,i){ r.id=i+1; return r; }));
      saveData(); changed = true;
    }
    if(d.cs && d.cs.length){
      csRecords = normCsList(d.cs.map(function(r,i){ r.id=i+1; return r; }));
      saveCs(); changed = true;
    }
    if(d.v) DATA_VERSION = d.v;
    CLOUD_STATUS = 'ok';
    if(changed){ route(); }
  }catch(e){
    CLOUD_STATUS = 'fail';
    route();  /* 重渲染以显示云端失败提示 */
  }
}

    '天机星':{m:1690, vr:.77, pr:.62, br:.52, ar:.69},
    '金牛-黄V团队':{m:1610, vr:.80, pr:.65, br:.55, ar:.71},
    '天损星':{m:1580, vr:.79, pr:.64, br:.54, ar:.70}
  };
  /* 1-8 月季节系数：2 月春节低谷，3-5 月旺季，暑期回升 */
  var season = [.92,.72,1.08,1.05,1.10,.98,1.02,1.06];
  var out=[], id=1;
  ORGS.forEach(function(org,oi){
    var b=base[org], rnd=seeded(oi*777+13);
    for(var mo=1; mo<=8; mo++){
      var days = new Date(2026, mo, 0).getDate();
      var mScale = b.m * season[mo-1] * (0.95+0.1*rnd());
      for(var d=1; d<=days; d++){
        var wave = 0.72 + 0.56*rnd() + (d>=25?0.12:0);       // 月末略高
        var tot  = Math.max(5, Math.round(mScale/days*wave));
        var val  = Math.round(tot  * b.vr * (0.95+0.1*rnd()));
        var push = Math.round(val  * b.pr * (0.95+0.1*rnd()));
        var book = Math.round(push * b.br * (0.95+0.1*rnd()));
        var arr  = Math.round(book * b.ar * (0.95+0.1*rnd()));
        var day = {date:'2026-'+('0'+mo).slice(-2)+'-'+(d<10?'0'+d:d), org:org, tot:tot, val:val, push:push, book:book, arr:arr};
        splitByStaff(day, rnd).forEach(function(row){ row.id=id++; out.push(row); });
      }
    }
  });
  return out;
}

/* ==================== 计算层 ==================== */
/* ——「数据日」定义（2026-10-29 修正，勿回退）——
   ① 当天必须有实质业务记录（有效/转潜/预约/到诊）。
      「应到(due)」是按约诊日归桶的，可能落在明天/下月，绝不能当成数据日 ——
      否则空壳的应到桶会把「最新数据日」顶到未来，当日汇总会全变 0。
   ② 不可能超过昨天：三类表都是 T+1 才导出 T 日，今天的数据根本不存在。 */
function isDataDay(r){
  return !!(r.val||r.push||r.book||r.arr||r.jt||r.jw);
}
function shiftDay(dateStr, n){
  var d = dateStr ? new Date(dateStr+'T00:00:00') : new Date();
  d.setDate(d.getDate()+n);
  var p=function(x){return ('0'+x).slice(-2);};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function todayStr(){ return shiftDay(null, 0); }
function yesterdayStr(){ return shiftDay(null, -1); }
/* 数据日列表（降序、去重）：只认「有实质记录 且 不晚于昨天」的日期 */
function dataDates(){
  var lim=yesterdayStr(), seen={};
  records.forEach(function(r){ if(r.date<=lim && isDataDay(r)) seen[r.date]=1; });
  return Object.keys(seen).sort().reverse();
}
function latestDate(){ return dataDates()[0] || yesterdayStr(); }
function sum(list){
  var s={tot:0,val:0,push:0,book:0,arr:0,push_local:0,push_none:0,book_local:0,book_push:0,arr_local:0,arr_push:0};
  list.forEach(function(r){
    s.tot+=r.tot; s.val+=r.val; s.push+=r.push; s.book+=r.book; s.arr+=r.arr;
    s.push_local+=r.push_local||0; s.push_none+=r.push_none||0;
    s.book_local+=r.book_local||0; s.book_push+=r.book_push||0;
    s.arr_local+=r.arr_local||0; s.arr_push+=r.arr_push||0;
  });
  s.cvrt = s.val? s.arr/s.val*100 : 0;    // 转化 = 到诊 ÷ 有效
  return s;
}
function fmtPct(n){ return n.toFixed(2)+'%'; }
/* fmtDash：数值为 0/null/'' 时显示「—」 */
function fmtDash(n){ return (n===0||n==null||n==='') ? '—' : (typeof n==='number'? n.toLocaleString() : n); }
function fmtCvrt(s){ return s.val ? fmtPct(s.cvrt) : '—'; }

function dailyQuote(){
  var now=new Date();
  var start=new Date(now.getFullYear(),0,0);
  var doy=Math.floor((now-start)/86400000);          // 一年中的第几天
  var idx=(doy*7 + now.getFullYear()) % DAILY_QUOTES.length;  // 相邻天不同，逐年偏移
  return DAILY_QUOTES[idx];
}
function todayLabel(){
  var d=new Date(), p=function(n){return ('0'+n).slice(-2);};
  var wk=['日','一','二','三','四','五','六'][d.getDay()];
  return d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 星期'+wk;
}
function flipQuote(){
  var banner=document.querySelector('.quote-banner');
  if(!banner) return;
  var txt=banner.querySelector('.q-text'), src=banner.querySelector('.q-src');
  if(!txt) return;
  var idx=Math.floor(Math.random()*DAILY_QUOTES.length);
  var q=DAILY_QUOTES[idx];
  txt.textContent=q.t;
  if(src) src.textContent=q.s;
  txt.classList.remove('q-anim'); void txt.offsetWidth; txt.classList.add('q-anim');
}

/* 月度目标：每月月初确定一次，之后整月不动（全设备统一）
   1) MONTH_TARGET[月份]  = 该月既定目标（月初写入一次，历史月份不被新目标污染）
   2) DEFAULT_TARGET      = 兜底值，仅用于「尚未配置目标」的月份（新月份未定时用最近一档）
   3) localStorage 本机覆盖 = 临时试算用，只影响本机
   getTarget 优先级：本机本月 > 本机通用'*' > MONTH_TARGET[月] > DEFAULT_TARGET */
var MONTH_TARGET = {
  '2026-08': { val:700,  push:500,  book:60,  arr:60 },
  '2026-09': { val:1500, push:1200, book:140, arr:90 }
};
var DEFAULT_TARGET = { val:1500, push:1200, book:140, arr:90 };
var TG_KEY = 'dy_target_v1';
var TG_FIELDS = [['val','有效'],['push','转潜'],['book','预约'],['arr','到诊']];
var TG_MONTH = '';
function loadTargets(){ try{ return JSON.parse(localStorage.getItem(TG_KEY)||'{}')||{}; }catch(e){ return {}; } }
function saveTargets(o){ try{ localStorage.setItem(TG_KEY, JSON.stringify(o)); }catch(e){} }
function getTarget(month){
  var all = loadTargets();
  var fixed = MONTH_TARGET[month] || DEFAULT_TARGET;
  var t = all[month] || all['*'] || {};
  var o = {};
  TG_FIELDS.forEach(function(f){
    var k=f[0];
    var v=(t[k]==null||t[k]==='') ? null : +t[k];
    if(v==null || isNaN(v) || v<0) v = fixed[k];
    o[k] = v;
  });
  return o;
}

function prevDay(dateStr){
  var d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()-1);
  var p=function(n){return ('0'+n).slice(-2);};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function prevMonthStr(month){
  var y=+month.slice(0,4), m=+month.slice(5,7)-1;
  if(m===0){ m=12; y--; }
  return y+'-'+('0'+m).slice(-2);
}
function daysGap(a,b){
  var d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
/* 环比提示：cur 当前值，prev 对比值；kind='num' 数值差+百分比 | 'pp' 百分点差 */
function deltaTxt(cur, prev, prefix, kind){
  var d = cur - prev;
  if(kind==='pp'){
    if(prev===0) return null;
    var s = d>0?'+':(d<0?'':'');
    return {txt: prefix+' '+(s+d.toFixed(1))+'pp', cls: d>0?'up':(d<0?'down':'flat')};
  }
  if(prev===0 && cur===0) return null;
  if(prev===0) return {txt: prefix+' +'+cur, cls: cur>0?'up':'flat'};
  var pct = d/prev*100;
  var sign = d>0?'+':'';
  return {txt: prefix+' '+sign+d+'（'+sign+pct.toFixed(0)+'%）', cls: d>0?'up':(d<0?'down':'flat')};
}
/* 数据新鲜度健康条（tag 位显示数据版本号 + 一键刷新） */
function healthBar(ld, today, ver){
  var gap = daysGap(ld, today);
  var dot, txt, cls='';
  if(gap<0){ dot='warn'; cls='warn'; txt='数据日期 <b>'+ld+'</b> 异常（晚于今天），请检查'; }
  else if(gap===0){ dot='ok';  txt='数据已更新至 <b>'+ld+'</b>（今天）'; }
  else if(gap===1){ dot='ok';  txt='数据已更新至 <b>'+ld+'</b>（昨天）'; }
  else if(gap<=3){ dot='warn'; cls='warn'; txt='数据最新更新至 <b>'+ld+'</b>，已过去 <b>'+gap+'</b> 天'; }
  else { dot='bad'; cls='bad'; txt='数据最新更新至 <b>'+ld+'</b>，已断更 <b>'+gap+'</b> 天，请及时补录'; }
  var tag = ver ? '<span class="hb-tag" title="当前加载的数据版本号；若与最新发布版本不一致，说明浏览器缓存了旧数据，请点右侧刷新">数据版本 '+ver+'</span>' : '';
  var btn = '<button class="hb-refresh" onclick="updateApp()" title="清空浏览器缓存并强制重新加载最新数据">↻ 刷新数据</button>';
  return '<div class="health-bar"><span class="hb-dot '+dot+'"></span><span class="hb-txt '+cls+'">'+txt+'</span>'+tag+btn+'</div>';
}
/* 本月倒计时 + 日均缺口（常驻，正向驱动） */
function gapBar(M, month, today){
  var y=+month.slice(0,4), mo=+month.slice(5,7);
  var TG=getTarget(month);
  var lastDay=new Date(y, mo, 0).getDate();
  var left=Math.max(0, lastDay - (+today.slice(8,10)) + 1);
  var items=[
    {name:'有效', cur:M.val,  tgt:TG.val},
    {name:'转潜', cur:M.push, tgt:TG.push},
    {name:'预约', cur:M.book, tgt:TG.book},
    {name:'到诊', cur:M.arr,  tgt:TG.arr}
  ];
  var h='<div class="gap-bar"><div class="gap-head">⏳ '+mo+'月剩 <b>'+left+'</b> 天'
      +(left===0?'<span class="gap-end">（本月已结束，以下为最终缺口）</span>':'')+'</div>'
      +'<div class="gap-items">';
  items.forEach(function(it){
    var remain=it.tgt-it.cur;
    var rmTxt=(Math.round(remain*10)/10).toLocaleString();
    if(remain<=0){ h+='<span class="gap-item ok">'+it.name+' 已达成 ✓</span>'; return; }
    if(left===0){ h+='<span class="gap-item warn">'+it.name+' 差 '+rmTxt+'</span>'; return; }
    /* 日均缺口超过「目标/30」说明进度已落后，标黄 */
    var per=remain/left;
    var warn=per > (it.tgt/30) ? ' warn' : '';
    h+='<span class="gap-item'+warn+'">'+it.name+' 差 '+rmTxt+' <b>日均需 '+per.toFixed(1)+'</b></span>';
  });
  h+='</div></div>';
  return h;
}
/* 真异常告警区：断更 / 渠道断流 / 客服连续挂零 / 到诊告急
   设计原则：单日波动不报，只报「连续 N 个数据日」的持续性异常，避免天天误报 */
function alertsHTML(ld, today){
  var alerts=[], hints=[], checks=[], arrZero3=[], zeroMon=[];
  var gap=daysGap(ld, today);
  if(gap>=2) alerts.push({txt:'数据已断更 '+gap+' 天（最新 '+ld+'），请及时补录', go:''});

  /* 最近若干个「有数据的日期」（降序）——按数据日而非自然日，避免休假日干扰；
     口径同 latestDate()：排除纯应到空壳桶与未来日期 */
  var dates=dataDates();
  var ym=ld.slice(0,7);

  /* 渠道断流：连续 3 个数据日有效=0，且该渠道当月累计有效≥5（本该有量的才报） */
  var N=3, recent=dates.slice(0,N);
  if(recent.length===N){
    ORGS.forEach(function(og){
      var monVal=sum(records.filter(function(r){ return r.date.slice(0,7)===ym && r.org===og; })).val;
      if(monVal < 5) return;
      var dead=recent.every(function(d){
        return sum(records.filter(function(r){ return r.date===d && r.org===og; })).val===0;
      });
      if(dead) alerts.push({txt:'渠道「'+og+'」连续 '+N+' 个数据日无有效线索（当月累计 '+monVal+'，疑似断流）', go:'staffperf'});
    });
    /* 客服连续挂零：仅监测标准 4 客服（脏值已剔除） */
    STAFF.forEach(function(st){
      var dead=recent.every(function(d){
        return sum(records.filter(function(r){ return r.date===d && r.staff===st; })).val===0;
      });
      if(dead) alerts.push({txt:'客服「'+st+'」连续 '+N+' 个数据日有效挂零', go:'staffperf'});
    });
    /* 客服到诊告警（按严重度排序，越严重越靠前，红色区）：
       ① 一级 = 当月累计到诊 0，且当月已过 ≥N 个数据日（整月未开张，最严重，一定排最前）
       ② 二级 = 当月累计到诊 >0 但连续 N 个数据日到诊=0（本该有量却停摆） */
    var monDays=dataDates().filter(function(d){ return d.slice(0,7)===ym; }).length;
    STAFF.forEach(function(st){
      var monArr=sum(records.filter(function(r){ return r.date.slice(0,7)===ym && r.staff===st; })).arr;
      if(monArr<=0){
        if(monDays>=N){
          zeroMon.push(st);
          alerts.push({txt:'客服「'+st+'」当月累计到诊 = 0，已连续 '+monDays+' 个数据日未开张（最严重）——请核查线索质量与预约转化', go:'staffperf'});
        }
        return;
      }
      var dead=recent.every(function(d){
        return sum(records.filter(function(r){ return r.date===d && r.staff===st; })).arr===0;
      });
      if(dead){ arrZero3.push(st); alerts.push({txt:'客服「'+st+'」连续 '+N+' 个数据日到诊挂零（当月累计 '+monArr+' 人）', go:'staffperf'}); }
    });
  }
  /* 客服到诊挂零·提示级：最新数据日（ld）到诊=0（已达告警级/待核查级的不再重复提示） */
  var yZero=STAFF.filter(function(st){
    if(arrZero3.indexOf(st)>=0 || zeroMon.indexOf(st)>=0) return false;
    return sum(records.filter(function(r){ return r.date===ld && r.staff===st; })).arr===0;
  });
  if(yZero.length) hints.push({txt:'最新数据日（'+ld+'）到诊挂零：'+yZero.join('、'), go:'staffperf'});
  /* 到诊告急：最近 7 个数据日累计到诊为 0（7 日颗粒度，规避到诊数据天然滞后） */
  var last7=dates.slice(0,7);
  if(last7.length>=4){
    var arr7=sum(records.filter(function(r){ return last7.indexOf(r.date)>=0; })).arr;
    if(arr7===0) alerts.push({txt:'最近 '+last7.length+' 个数据日（'+last7[last7.length-1]+' ~ '+last7[0]+'）累计到诊为 0，请补录到诊表', go:'funnel'});
  }
  /* 数据缺口级：当月有人有量、但其中有人压根没到诊、且当月数据日不足 N 个（还没到能判定「整月未开张」的火候）
     ——这种才放「待核查」，与红色告警区分开，避免把「数据太少」误当成「人不行」 */
  (function(){
    var monthStaffArr={}, anyArr=false;
    STAFF.forEach(function(st){
      var a=sum(records.filter(function(r){ return r.date.slice(0,7)===ym && r.staff===st; })).arr;
      monthStaffArr[st]=a; if(a>0) anyArr=true;
    });
    if(!anyArr) return;
    var zeros=STAFF.filter(function(st){
      return monthStaffArr[st]===0 && zeroMon.indexOf(st)<0 && arrZero3.indexOf(st)<0;
    });
    if(zeros.length){
      checks.push({txt:'当月到诊为 0 的客服：'+zeros.join('、')+' —— 请核实其预约/到院记录是否漏录', go:'staffperf'});
    }
  })();
  if(!alerts.length && !hints.length && !checks.length) return '';
  var h='';
  if(alerts.length){
    h+='<div class="alert-bar"><div class="alert-head">⚠ 异常提醒（'+alerts.length+'）</div>';
    alerts.forEach(function(a){
      h+='<div class="alert-item"><span class="alert-txt">'+a.txt+'</span>'
        +(a.go?'<button class="alert-go" onclick="go(\''+a.go+'\')">查看 →</button>':'')+'</div>';
    });
    h+='</div>';
  }
  if(hints.length){
    h+='<div class="alert-bar hint"><div class="alert-head">◔ 提示（'+hints.length+'）</div>';
    hints.forEach(function(a){
      h+='<div class="alert-item"><span class="alert-txt">'+a.txt+'</span>'
        +(a.go?'<button class="alert-go" onclick="go(\''+a.go+'\')">查看 →</button>':'')+'</div>';
    });
    h+='</div>';
  }
  if(checks.length){
    h+='<div class="alert-bar check"><div class="alert-head">◧ 待核查（'+checks.length+'）</div>';
    checks.forEach(function(a){
      h+='<div class="alert-item"><span class="alert-txt">'+a.txt+'</span>'
        +(a.go?'<button class="alert-go" onclick="go(\''+a.go+'\')">查看 →</button>':'')+'</div>';
    });
    h+='</div>';
  }
  return h;
}

/* 月度目标达成进度条 + 目标编辑（存本机，按月独立） */

  var items=[
    {name:'有效', color:'#1d6fe0', tgt:TG.val,  cur:M.val},
    {name:'转潜', color:'#0e9f9f', tgt:TG.push, cur:M.push},
    {name:'预约', color:'#e6a23c', tgt:TG.book, cur:M.book},

  ];
  var h='<div class="sec-title"><span class="dot blue"></span>本月目标达成 <span class="meta">'+month
      +(isCustom?' · 已自定义':'')+'</span>'
      +'<button class="tg-btn" onclick="toggleTargetEdit()">✎ 设置目标</button></div>';

    h+='<label class="tg-field"><span>'+f[1]+'</span><input type="number" min="0" step="1" id="tg_'+f[0]+'" value="'+TG[f[0]]+'"></label>';
  });
  h+='</div><div class="tg-acts">'
    +'<button class="btn primary" onclick="saveTarget()">保存</button>'
    +'<button class="btn" onclick="toggleTargetEdit()">取消</button>'
    +'<button class="btn danger" onclick="resetTarget()">恢复默认</button>'
    +'<span class="tg-note">仅作用于 '+month+' · 存在本机浏览器（换设备不同步）；全设备统一目标按月初既定值写入代码 MONTH_TARGET</span>'
    +'</div></div>';
  h+='<div class="goal-grid">';
  items.forEach(function(it){
    var pct = it.tgt ? Math.min(100, it.cur/it.tgt*100) : 0;
    var remain = it.tgt - it.cur;
    var foot = remain>0 ? '距目标差 '+remain.toLocaleString() : '<span class="ok">已达成 ✓</span>';
    h+='<div class="goal">'
      +'<div class="goal-head"><span class="goal-name">'+it.name+'</span><span class="goal-num">'+it.cur.toLocaleString()+'<small> / '+it.tgt.toLocaleString()+'</small></span></div>'
      +'<div class="goal-track"><div class="goal-fill" style="width:'+pct.toFixed(1)+'%;background:'+it.color+'"></div></div>'
      +'<div class="goal-foot"><span>'+pct.toFixed(1)+'%</span><span>'+foot+'</span></div>'
      +'</div>';
  });
  h+='</div>';
  return h;
}
/* 目标编辑交互 */
function toggleTargetEdit(){
  var el=document.getElementById('tgEdit');

  if(el.style.display==='none'){
    el.style.display='block';
    var i=document.getElementById('tg_val');
    if(i){ i.focus(); i.select(); }
  } else {
    el.style.display='none';
  }
}
function saveTarget(){
  var all=loadTargets(), o={};
  TG_FIELDS.forEach(function(f){
    var k=f[0], el=document.getElementById('tg_'+k);
    var v=el ? parseFloat(el.value) : NaN;
    o[k]=(isNaN(v)||v<0) ? DEFAULT_TARGET[k] : v;
  });
  all[TG_MONTH]=o; saveTargets(all);
  renderDashboard();

function resetTarget(){
  var all=loadTargets(); delete all[TG_MONTH]; saveTargets(all);

}

function renderDashboard(){

  var dayList  = records.filter(function(r){return r.date===ld;});
  var monList  = records.filter(function(r){return r.date.slice(0,7)===month;});
  var D = sum(dayList), M = sum(monList);
  var daysInMonth = new Date(+month.slice(0,4), +month.slice(5,7), 0).getDate();

  /* 环比：昨日 / 上月 */
  var yday = prevDay(ld);
  var YD = sum(records.filter(function(r){return r.date===yday;}));
  var pm = prevMonthStr(month);
  var PM = sum(records.filter(function(r){return r.date.slice(0,7)===pm;}));

  var html = '';
  /* 数据新鲜度健康条（含版本号） */
  html += healthBar(ld, today, DATA_VERSION);
  /* 云端拉取失败提示 */

  /* 本月倒计时 + 日均缺口（常驻） */
  html += gapBar(M, month, today);

  /* 本月目标达成 */

  /* 当日汇总（含环比） */

  html += '<div class="kpi-grid">'
    + kpi('有效',   D.val.toLocaleString(), 'c-blue',  'day','val',  deltaTxt(D.val,  YD.val,  '较昨日'))
    + kpi('转潜',   D.push.toLocaleString(),'c-teal',  'day','push', deltaTxt(D.push, YD.push, '较昨日'))
    + kpi('预约',   D.book.toLocaleString(),'c-orange','day','book', deltaTxt(D.book, YD.book, '较昨日'))
    + kpi('到诊',   D.arr+'<small>人</small>','c-red', 'day','arr',  deltaTxt(D.arr,  YD.arr,  '较昨日'))
    + kpi('总转化', fmtCvrt(D),         'c-green', 'day','cvrt', D.val? deltaTxt(D.cvrt, YD.cvrt, '较昨日','pp') : null)
    + '</div>';

  /* 当月汇总（含环比） */
  html += '<div class="sec-title"><span class="dot blue"></span>当月汇总 <span class="meta">'+month+' · 已统计 '+daysInMonth+' 天</span></div>';
  html += '<div class="kpi-grid">'
    + kpi('月有效',   M.val.toLocaleString(),  'c-blue',  'mon','val',  deltaTxt(M.val,  PM.val,  '较上月'))
    + kpi('月转潜',   M.push.toLocaleString(), 'c-teal',  'mon','push', deltaTxt(M.push, PM.push, '较上月'))
    + kpi('月预约',   M.book.toLocaleString(), 'c-orange','mon','book', deltaTxt(M.book, PM.book, '较上月'))
    + kpi('月到诊',   M.arr.toLocaleString()+'<small>人</small>','c-red','mon','arr', deltaTxt(M.arr, PM.arr, '较上月'))
    + kpi('月总转化', fmtCvrt(M),          'c-green', 'mon','cvrt', M.val? deltaTxt(M.cvrt, PM.cvrt, '较上月','pp') : null)
    + '</div>';

  /* 图表行 */
  html += '<div class="chart-row">'
    + '<div class="panel"><h3>近 7 日有效 / 到诊趋势</h3>'
    + '<div class="legend"><span class="lg"><i class="sw" style="background:#1d6fe0"></i>有效</span><span class="lg"><i class="sw" style="background:#e64500"></i>到诊</span></div>'
    + '<div id="trendChart"></div></div>'
    + '<div class="panel"><h3>'+month+' · 各渠道到诊</h3><div class="legend"><span class="lg"><i class="sw" style="background:#e64500"></i>当月到诊（人）</span></div>'
    + '<div id="orgChart"></div></div>'
    + '</div>';

  /* 每日一言（移至底部） */

    + '<div class="q-text">'+q.t+'</div>'
    + '<div class="q-meta"><div class="q-src">'+q.s+'</div><div class="q-flip" onclick="flipQuote()">换一句 ↻</div></div>'
    + '</div>';

  setView('仪表盘', html);

}

function kpi(label, value, cls, scope, metric, delta){
  var d = delta ? '<div class="delta '+delta.cls+'">'+delta.txt+'</div>' : '';
  return '<div class="kpi" onclick="openDetail(\''+scope+'\',\''+metric+'\',\''+label+'\')">'
    + '<div class="label">'+label
    + '<svg class="arrow" viewBox="0 0 24 24" fill="none"><path d="M7 17 17 7M9 7h8v8" stroke="#8492a6" stroke-width="2" stroke-linecap="round"/></svg></div>'
    + '<div class="value '+cls+'">'+value+'</div>'
    + d + '</div>';
}

/* 近 7 日 组合图：柱=有效（左轴） 折线=到诊（右轴） */
function drawTrend(ld){
  var days=[];
  for(var i=6;i>=0;i--){
    var d=new Date(ld+'T00:00:00'); d.setDate(d.getDate()-i);
    days.push(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2));
  }
  var data = days.map(function(day){
    var s = sum(records.filter(function(r){return r.date===day;}));
    return {day:day.slice(5), val:s.val, arr:s.arr};
  });
  var W=620,H=260,pl=48,pr=40,pt=16,pb=34;
  var cw=(W-pl-pr)/data.length;
  var maxVal=Math.max.apply(null,data.map(function(d){return d.val;}))*1.15 || 1;
  var maxArr=Math.max.apply(null,data.map(function(d){return d.arr;}))*1.3 || 1;

  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  for(var g=0;g<=4;g++){
    var y=pt+(H-pt-pb)*g/4;
    s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#eef2f7"/>';
    var v=Math.round(maxVal*(1-g/4));
    s+='<text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#8492a6">'+v+'</text>';
    var hv=Math.round(maxArr*(1-g/4));
    s+='<text x="'+(W-pr+8)+'" y="'+(y+4)+'" font-size="10" fill="#e64500">'+hv+'</text>';
  }
  var pts=[];
  data.forEach(function(d,i){
    var x=pl+cw*i+cw/2;
    var bh=(H-pt-pb)*d.val/maxVal;
    s+='<rect x="'+(x-cw*0.26)+'" y="'+(H-pb-bh)+'" width="'+(cw*0.52)+'" height="'+bh+'" rx="3" fill="#1d6fe0"><title>'+d.day+' 有效 '+d.val+'</title></rect>';
    var y=H-pb-(H-pt-pb)*d.arr/maxArr;
    pts.push([x,y]);
    s+='<text x="'+x+'" y="'+(H-pb+16)+'" text-anchor="middle" font-size="10" fill="#8492a6">'+d.day+'</text>';
  });
  var path=pts.map(function(p,i){return (i?'L':'M')+p[0]+' '+p[1];}).join(' ');
  s+='<path d="'+path+'" fill="none" stroke="#e64500" stroke-width="2.5"/>';
  pts.forEach(function(p,i){
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#fff" stroke="#e64500" stroke-width="2"><title>'+data[i].day+' 到诊 '+data[i].arr+'</title></circle>';
  });
  s+='</svg>';
  document.getElementById('trendChart').innerHTML=s;
}

/* 各渠道到诊横向柱状图（当月累计）；括号内拆分本点 / 推出到诊 */
function drawOrgBars(month){
  var rows = ORGS.map(function(org){
    var list=records.filter(function(r){return r.date.slice(0,7)===month && r.org===org;});
    var s=sum(list), l=0, p=0;
    list.forEach(function(r){ l+=(r.arr_local||0); p+=(r.arr_push||0); });
    return {org:org, arr:s.arr, local:l, push:p};
  }).sort(function(a,b){return b.arr-a.arr;});
  var max=Math.max.apply(null,rows.map(function(r){return r.arr;})) || 1;
  var W=460, rh=34, H=rows.length*rh+10, pl=110, pr=162;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  rows.forEach(function(r,i){
    var y=i*rh+8, bw=(W-pl-pr)*r.arr/max;
    // 仅当本点+推出有数时才展示拆分，避免历史桶无拆分字段时显示 0/0
    var split = (r.local+r.push)>0;
    var tip = r.org+' 到诊 '+r.arr+' 人'+(split? '（本点 '+r.local+' · 推出 '+r.push+'）' : '');
    s+='<text x="'+(pl-8)+'" y="'+(y+13)+'" text-anchor="end" font-size="12" fill="#1f2d3d">'+r.org+'</text>';
    s+='<rect x="'+pl+'" y="'+y+'" width="'+Math.max(bw,2)+'" height="18" rx="4" fill="#e64500"><title>'+tip+'</title></rect>';
    s+='<text x="'+(pl+bw+8)+'" y="'+(y+13)+'" font-size="11" fill="#e64500" font-weight="700">'+r.arr+' 人'
      + (split? '<tspan font-size="10" font-weight="400" fill="#9a6a55">（本点 '+r.local+' · 推出 '+r.push+'）</tspan>' : '')
      + '</text>';
  });
  s+='</svg>';
  document.getElementById('orgChart').innerHTML=s;
}

/* ==================== 弹窗：各渠道明细 ==================== */
var METRICS = {
  val: {name:'有效',   get:function(s){return s.val;},  fmt:function(s){return s.val.toLocaleString();}},
  push:{name:'转潜',   get:function(s){return s.push;}, fmt:function(s){return s.push.toLocaleString();}},
  book:{name:'预约',   get:function(s){return s.book;}, fmt:function(s){return s.book.toLocaleString();}},
  arr: {name:'到诊',   get:function(s){return s.arr;},  fmt:function(s){return s.arr.toLocaleString();}},
  cvrt:{name:'总转化', get:function(s){return s.cvrt;}, fmt:function(s){return fmtCvrt(s);}},
};
/* 各渠道明细表（全字段：有效 / 本点 / 推出 / 未转潜 / 各率）
   弹窗与「年度数据」页共用同一套渲染，避免两处实现漂移。
   list = 记录集合（某天或某月）；metric = 需高亮的指标分组，null 则不高亮 */
function orgDetailHTML(list, metric){
  var T = sum(list);
  // 本点/推出拆分口径自 2026-10 启用，更早月份无细分数据
  var hasSplit = (T.push_local||0)+(T.push_none||0)+(T.book_local||0)+(T.book_push||0) > 0;
  var rate = function(num,den){ return den>0 ? fmtPct(num/den*100) : '—'; };
  var dN   = function(n){ return hasSplit ? n.toLocaleString() : '—'; };
  var dR   = function(num,den){ return hasSplit ? rate(num,den) : '—'; };
  // 点击哪个指标卡，就高亮对应列（转潜/预约两条链同时高亮）
  var HL={val:['val'],push:['pl','pp'],book:['bl','bp'],arr:['arr'],cvrt:['cvrt']};
  var cell=function(key,html,isRate){
    return '<td class="'+((HL[metric]||[]).indexOf(key)>=0?'hl ':'')+(isRate?'rate':'')+'">'+html+'</td>';
  };
  var rows = ORGS.map(function(org){
    return {org:org, s:sum(list.filter(function(r){return r.org===org;}))};
  });
  var m = METRICS[metric] || METRICS.val;
  rows.sort(function(a,b){ return m.get(b.s)-m.get(a.s); });

  var line = function(name, s){
    return '<tr><td style="text-align:left">'+name+'</td>'
      +cell('val', s.val.toLocaleString())
      // 本点链
      +cell('pl', dN(s.push_local))
      +cell('bl', dN(s.book_local))
      +cell('blr', dR(s.book_local,s.push_local), true)
      +cell('al', dN(s.arr_local))
      +cell('alr', dR(s.arr_local,s.book_local), true)
      +cell('lcv', dR(s.arr_local,s.push_local), true)
      // 推出链
      +cell('pp', dN(s.push))
      +cell('bp', dN(s.book_push))
      +cell('bpr', dR(s.book_push,s.push), true)
      +cell('ap', dN(s.arr_push))
      +cell('apr', dR(s.arr_push,s.book_push), true)
      +cell('pcv', dR(s.arr_push,s.push), true)
      // 汇总
      +cell('pn', dN(s.push_none))
      +cell('arr', s.arr.toLocaleString())
      +cell('cvrt', fmtCvrt(s), true)
      +'</tr>';
  };

  return '<div style="font-size:12px;color:var(--txt2);margin:2px 0 8px;line-height:1.7">'
    +'本点 = 先聊与转潜同中心　·　推出 = 跨中心转潜　·　预约率 = 预约÷转潜　·　到诊率 = 到诊÷预约　·　转化 = 到诊÷转潜（本点/推出各走各链）　·　总转化 = 总到诊÷有效'
    +(hasSplit?'':'<br><b style="color:var(--red)">该月早于拆分口径启用（2026-10 起），本点/推出/未转潜列以「—」显示。</b>')
    +'</div>'
    +'<div class="table-wrap"><table class="mtx"><thead>'
    +'<tr class="grp"><th rowspan="2">渠道</th><th rowspan="2">有效</th>'
    +'<th colspan="6" class="g-local">本点</th>'
    +'<th colspan="6" class="g-push">推出</th>'
    +'<th colspan="3" class="g-sum">汇总</th></tr>'
    +'<tr>'
    +'<th>转潜</th><th>预约</th><th class="rate-h">预约率</th><th>到诊</th><th class="rate-h">到诊率</th><th class="rate-h">转化</th>'
    +'<th>转潜</th><th>预约</th><th class="rate-h">预约率</th><th>到诊</th><th class="rate-h">到诊率</th><th class="rate-h">转化</th>'
    +'<th>未转潜</th><th>到诊</th><th class="rate-h">总转化</th>'
    +'</tr></thead><tbody>'
    + rows.map(function(r){ return line(r.org, r.s); }).join('')
    +'</tbody><tfoot>'+line('合计', T)+'</tfoot></table></div>';
}

function renderRecRows(){
  var sorted=records.slice().sort(function(a,b){
    return b.date===a.date ? ORGS.indexOf(a.org)-ORGS.indexOf(b.org) : (b.date<a.date?-1:1);
  });

    h+='<tr><td>'+r.date+'</td><td>'+r.org+'</td><td>'+(r.staff||'-')+'</td><td>'+r.val+'</td>'

  });
  document.getElementById('recTbody').innerHTML = h || '<tr><td colspan="9" class="empty">暂无数据，请先录入</td></tr>';

function addRecord(){
  var g=function(id){return document.getElementById(id).value;};
  var date=g('f_date'), org=g('f_org'), staff=g('f_staff');
  var tot=0, val=+g('f_val')||0, push=+g('f_push')||0, book=+g('f_book')||0, arr=+g('f_arr')||0;
  if(!date){ alert('请选择日期'); return; }
  if(val+push+book+arr===0){ alert('请至少填写一项数据'); return; }
  var exist=records.find(function(r){return r.date===date && r.org===org && r.staff===staff;});
  if(exist){ exist.tot=tot; exist.val=val; exist.push=push; exist.book=book; exist.arr=arr; }
  else{
    var nid=records.reduce(function(m,r){return Math.max(m,r.id);},0)+1;
    records.push({id:nid,date:date,org:org,staff:staff,tot:tot,val:val,push:push,book:book,arr:arr});
  }
  saveData(); renderManage();
}
function delRecord(id){
  records=records.filter(function(r){return r.id!==id;});
  saveData(); renderRecRows();
}
function clearSample(){
  if(!confirm('确定清空示例数据并从头开始录入吗？'))return;
  records=[]; saveData(); renderManage();
}
function clearAll(){
  if(!confirm('⚠️ 将删除全部 '+records.length+' 条数据，此操作不可恢复！\n建议先「导出 JSON」备份。确定继续吗？'))return;
  if(!confirm('再次确认：真的要清空全部数据吗？'))return;
  records=[]; saveData(); renderManage();
}

      +'<td><button class="btn danger" style="padding:4px 10px;min-height:30px" onclick="delAsset('+a.id+')">删除</button></td></tr>';
  });

}
function addAssets(){
  var model=document.getElementById('a_model').value.trim();
  var qty=Math.max(1, +document.getElementById('a_qty').value||1);
  var status=document.getElementById('a_status').value;
  if(!model){ alert('请输入手机型号'); return; }
  var nextId=assets.reduce(function(m,a){return Math.max(m,a.id);},0)+1;
  for(var i=0;i<qty;i++){
    assets.push({id:nextId+i, model:model, sn:'DY-SJ-'+('000'+(nextId+i)).slice(-3), status:status});
  }
  saveAssets(); renderAssets();
}
function delAsset(id){
  assets=assets.filter(function(a){return a.id!==id;});
  saveAssets(); renderAssets();
}
function clearAssets(){
  if(!confirm('确定清空全部资产吗？此操作不可恢复')) return;
  assets=[]; saveAssets(); renderAssets();
}

/* ==================== 视图：盈亏分析 ==================== */
var profitScope = 'mon'; // 'mon' 最新月 | 'year' 年度 | 'YYYY-MM' 具体月
function setProfitScope(s){ profitScope=s; renderProfit(); }

function fmtMoney(n){
  return n.toLocaleString('zh-CN',{maximumFractionDigits:0});
}
function profitKpi(label, value, cls){
  return '<div class="kpi"><div class="label">'+label+'</div><div class="value '+cls+'">'+value+'</div></div>';
}

function renderProfit(){
  var ld=latestDate(), month=ld.slice(0,7), year=ld.slice(0,4);
  var label, list;

  var staffCount = STAFF.length;
  var perCost;
  // 有数据的月份（升序），用于动态生成月份按钮
  var months=[];
  records.forEach(function(r){ var m=r.date.slice(0,7); if(months.indexOf(m)<0) months.push(m); });
  months.sort();

  if(profitScope==='year'){
    label='年度（'+year+'）'; list=records.filter(function(r){return r.date.slice(0,4)===year;});
    perCost = 10000 * (+month.slice(5,7));   // 按当年已过月份累计：8月=8万/人
  }else{
    var m = (profitScope==='mon') ? month : profitScope;   // 'mon'=最新月；否则为具体月份
    label = (m===month) ? '当月（'+month+'）' : m.slice(5,7)+' 月';
    list = records.filter(function(r){return r.date.slice(0,7)===m;});
    perCost = 10000;   // 单月口径：固定 1万/人/月
  }
  var totalCost = perCost * staffCount;

  function calc(arr, cost){
    var local=0, push=0;
    arr.forEach(function(r){ local+=(r.arr_local||0); push+=(r.arr_push||0); });
    var income = local*2100 + push*1050;     // 本点¥2100/个 · 推出¥1050/个
    var profit = income - cost;
    return {
      local: local, push: push, arr: local+push,
      income: income, cost: cost, profit: profit,
      margin: income? profit/income*100 : (profit? -100 : 0)
    };
  }

  var T = calc(list, totalCost);   // 团队：成本=全员固定成本
  var pbtn=function(s,n,active){ return '<button class="btn'+(active?' primary':'')+'" onclick="setProfitScope(\''+s+'\')">'+n+'</button>'; };
  var h='<div class="toolbar" style="margin:0 0 14px 0">';
  months.forEach(function(m){
    var active = (profitScope===m) || (profitScope==='mon' && m===month);
    h += pbtn(m, (+m.slice(5,7))+'月', active);
  });
  h += pbtn('year','年度', profitScope==='year')
     + '<button class="btn" style="margin-left:auto" onclick="showReport()">生成月报</button></div>';

  h+='<div class="sec-title"><span class="dot"></span>团队盈亏总览 <span class="meta">'+label+' · 本点¥2100/个 · 推出¥1050/个 · 成本='+staffCount+'人×¥'+fmtMoney(perCost)+'</span></div>'
    +'<div class="kpi-grid cols6">'
    +profitKpi('本点到诊', T.local.toLocaleString()+'<small>人</small>', 'c-blue')
    +profitKpi('推出到诊', T.push.toLocaleString()+'<small>人</small>', 'c-orange')
    +profitKpi('总收入', '¥'+fmtMoney(T.income), 'c-blue')
    +profitKpi('成本', '¥'+fmtMoney(T.cost)+'<small> 固定</small>', 'c-dark')
    +profitKpi('人效合计', '¥'+fmtMoney(T.profit), T.profit>=0?'c-red':'c-green')
    +profitKpi('人均生产力', '¥'+fmtMoney(T.profit / staffCount), T.profit>=0?'c-red':'c-green')
    +'</div>';

  h+='<div class="sec-title"><span class="dot blue"></span>客服盈亏明细 <span class="meta">按人效排序 · 人效=该客服收入−¥'+fmtMoney(perCost)+'</span></div>'
    +'<div class="panel"><div class="table-wrap"><table><thead><tr>'
    +'<th>客服</th><th>本点到诊</th><th>推出到诊</th><th>收入</th><th>成本分摊</th><th>人效</th>'
    +'</tr></thead><tbody>';

  var rows=STAFF.map(function(st){
    var r=calc(list.filter(function(r){return r.staff===st;}), perCost);  // 每人：成本=1万/人
    r.staff=st; return r;
  }).sort(function(a,b){return b.profit-a.profit;});

  rows.forEach(function(r){
    var profCls = r.profit>=0?'hl c-red':'hl c-green';
    h+='<tr><td>'+r.staff+'</td><td>'+r.local+'</td><td>'+r.push+'</td><td>¥'+fmtMoney(r.income)+'</td>'
      +'<td>¥'+fmtMoney(r.cost)+'</td><td class="'+profCls+'">¥'+fmtMoney(r.profit)+'</td></tr>';
  });

  h+='</tbody><tfoot><tr><td>团队合计</td><td>'+T.local+'</td><td>'+T.push+'</td><td>¥'+fmtMoney(T.income)+'</td>'
    +'<td>¥'+fmtMoney(T.cost)+'</td><td class="hl '+(T.profit>=0?'c-red':'c-green')+'">¥'+fmtMoney(T.profit)+'</td></tr></tfoot></table></div></div>';

  setView('盈亏分析', h);
}

/* ==================== 一键生成经营月报文本 ==================== */
function generateWeekReport(){
  var ld=latestDate(), month=ld.slice(0,7);
  var monList=records.filter(function(r){return r.date.slice(0,7)===month;});
  var M=sum(monList);
  var staffCount=STAFF.length, perCost=10000;
  var local=0, push=0;
  monList.forEach(function(r){ local+=(r.arr_local||0); push+=(r.arr_push||0); });
  var income=local*2100+push*1050;
  var cost=perCost*staffCount;
  var profit=income-cost;
  var rank=STAFF_ALL.map(function(st){ return {st:st, s:sum(monList.filter(function(r){return r.staff===st;}))}; })
    .sort(function(a,b){return b.s.arr-a.s.arr;});
  var L=[];
  L.push('【DY-CRM 经营月报】'+month);
  L.push('');
  L.push('一、核心漏斗');
  L.push('有效 '+M.val+' → 转潜 '+M.push+' → 预约 '+M.book+' → 到诊 '+M.arr);
  L.push('总转化（到诊÷有效）'+fmtCvrt(M));
  L.push('');
  L.push('二、客服到诊排名');
  rank.forEach(function(r,i){ L.push((i+1)+'. '+r.st+' '+r.s.arr+' 人（有效 '+r.s.val+'）'); });
  L.push('');
  L.push('三、盈亏（本点¥2100/个 · 推出¥1050/个）');
  L.push('本点到诊 '+local+' · 推出到诊 '+push);
  L.push('总收入 ¥'+fmtMoney(income)+' · 成本 ¥'+fmtMoney(cost)+'（'+staffCount+'人×¥1万）');
  L.push('人效合计 ¥'+fmtMoney(profit)+'（'+(profit>=0?'盈利':'亏损')+'）');
  return L.join('\n');
}
function showReport(){
  var txt=generateWeekReport();
  document.getElementById('modalTitle').textContent='经营月报 · '+latestDate().slice(0,7)+'（可复制粘贴）';
  var esc=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  document.getElementById('modalBody').innerHTML=
    '<textarea id="reportTxt" readonly style="width:100%;height:340px;font-size:13px;font-family:inherit;line-height:1.8;border:1px solid var(--line);border-radius:8px;padding:12px;box-sizing:border-box;resize:vertical;">'+esc+'</textarea>'
    +'<div style="margin-top:12px;display:flex;gap:10px;justify-content:flex-end;">'
    +'<button class="btn" onclick="closeModal()">关闭</button>'
    +'<button class="btn primary" onclick="copyReport()">复制全文</button></div>';
  document.getElementById('mask').classList.add('show');
}
function copyReport(){
  var ta=document.getElementById('reportTxt'); if(!ta) return;
  ta.focus(); ta.select(); ta.setSelectionRange(0,999999);
  var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  alert(ok?'已复制，可直接粘贴到微信':'复制失败，请手动全选复制');

var funnelPeriod='mon';
function setFunnelPeriod(p){ funnelPeriod=p; renderFunnel(); }
function renderFunnel(){
  var ld=latestDate(), month=ld.slice(0,7), year=ld.slice(0,4);
  var label, list;
  if(funnelPeriod==='day'){ label='当日（'+ld+'）'; list=records.filter(function(r){return r.date===ld;}); }
  else if(funnelPeriod==='mon'){ label='当月（'+month+'）'; list=records.filter(function(r){return r.date.slice(0,7)===month;}); }
  else { label='年度（'+year+'）'; list=records.filter(function(r){return r.date.slice(0,4)===year;}); }

  var s=sum(list);
  var stages=[
    {key:'val',  name:'有效', color:'#1d6fe0'},
    {key:'push', name:'转潜', color:'#0e9f9f'},
    {key:'book', name:'预约', color:'#e6a23c'},
    {key:'arr',  name:'到诊', color:'#e64500'}
  ];
  var maxV=s.val||1;
  var btn=function(p,t){ return '<button class="btn'+(funnelPeriod===p?' primary':'')+'" onclick="setFunnelPeriod(\''+p+'\')">'+t+'</button>'; };

  var h='<div class="toolbar" style="margin-top:0">'+btn('day','当日')+btn('mon','当月')+btn('year','年度')+'</div>';
  h+='<div class="sec-title"><span class="dot"></span>'+label+' 转化漏斗 <span class="meta">转化=到诊÷有效</span></div>';
  h+='<div class="panel"><div class="funnel">';
  stages.forEach(function(st, i){
    var v=s[st.key];
    var w=Math.round(v/maxV*100);
    var fill = v===0
      ? '<div class="fn-fill fn-zero">0</div>'
      : '<div class="fn-fill" data-w="'+w+'%" style="background:'+st.color+'">'+v.toLocaleString()+'</div>';
    h+='<div class="fn-row"><div class="fn-name">'+st.name+'</div>'
      +'<div class="fn-track">'+fill+'</div>'
      +'<div class="fn-val">'+v.toLocaleString()+'</div>'
      +'<div class="fn-pct">'+(i===0?'100%':(s.val?Math.round(v/s.val*100)+'%':'—'))+'</div></div>';
    if(i<stages.length-1){
      var nx=s[stages[i+1].key];
      var conv=v?(nx/v*100):0;
      var loss=v-nx;
      h+='<div class="fn-conn"><span>'+st.name+' → '+stages[i+1].name+' 转化 <span class="conv">'+conv.toFixed(1)+'%</span></span>'
        +'<span class="loss">流失 '+loss.toLocaleString()+'（'+((v?loss/v*100:0).toFixed(1))+'%）</span></div>';
    }
  });
  h+='</div></div>';

  /* 关键结论（先结论后证据） */
  var overall=s.val?(s.arr/s.val*100):0;
  var lostEff=s.val-s.push, lostPush=s.push-s.book, lostBook=s.book-s.arr;
  h+='<div class="fn-summary"><div class="ttl">关键结论</div>';
  h+='<p>整体转化（到诊÷有效）仅 <b>'+overall.toFixed(2)+'%</b>，即每 100 个有效线索最终约 <b>'+(s.val?(s.arr/s.val*100).toFixed(1):'0')+'</b> 个到诊。</p>';
  if(s.val>0){
    var segs=[['有效→转潜',lostEff],['转潜→预约',lostPush],['预约→到诊',lostBook]];
    segs.sort(function(a,b){return b[1]-a[1];});
    h+='<p>最大流失发生在 <b>'+segs[0][0]+'</b> 环节，流失 <b>'+segs[0][1].toLocaleString()+'</b> 人，是优先优化点。</p>';
  }
  h+='<p>预约→到诊 到院率 <b>'+(s.book?(s.arr/s.book*100).toFixed(1):'0')+'%</b>，已预约客户仍有提升空间（回访/提醒可挽回）。</p>';
  h+='</div>';

  setView('转化漏斗', h);
  requestAnimationFrame(function(){
    document.querySelectorAll('.fn-fill:not(.fn-zero)').forEach(function(el){ el.style.width=el.dataset.w; });
  });
}

var perfPeriod='mon';
function setPerfPeriod(p){ perfPeriod=p; renderStaffPerf(); }
function renderStaffPerf(){
  var ld=latestDate(), month=ld.slice(0,7), year=ld.slice(0,4);
  var label, list;
  if(perfPeriod==='day'){ label='当日（'+ld+'）'; list=records.filter(function(r){return r.date===ld;}); }
  else if(perfPeriod==='mon'){ label='当月（'+month+'）'; list=records.filter(function(r){return r.date.slice(0,7)===month;}); }
  else { label='年度（'+year+'）'; list=records.filter(function(r){return r.date.slice(0,4)===year;}); }

  var btn=function(p,t){ return '<button class="btn'+(perfPeriod===p?' primary':'')+'" onclick="setPerfPeriod(\''+p+'\')">'+t+'</button>'; };
  function rate(a,b){ return a? b/a*100 : 0; }

  var rows=STAFF_ALL.map(function(st){
    var s=sum(list.filter(function(r){return r.staff===st;}));
    return {st:st, s:s};
  });
  var T=sum(list);
  rows.forEach(function(r){ r.share = T.arr ? r.s.arr/T.arr*100 : 0; });
  /* 团队基准比率（用于「短板环节」诊断）。
     注意：**到院率（ar）刻意不参与诊断** —— 预约按预约日归月、到诊按到院日归月，
     跨月预约会让分母偏小、到院率虚高（9月实测 228%），拿它比会失真。 */
  var TREND={pr:rate(T.val,T.push), br:rate(T.push,T.book), cv:T.cvrt};
  rows.forEach(function(r){
    var s=r.s;
    var cur={pr:rate(s.val,s.push), br:rate(s.push,s.book), cv:s.cvrt};
    /* 样本门槛：有效<5 视为样本不足，不诊断 */
    if(s.val<5){ r.weak=null; return; }
    /* 各环节对团队均值算偏差（比率口径统一为「产出/上游」，越高越好）；
       留一点均值基准的相对差，避免团队整体差时全员报同一个环节 */
    var names={pr:'转潜', br:'预约', cv:'转化'};
    var tips={pr:'有效→转潜率偏低，需加强首轮沟通与需求挖掘',
              br:'转潜→预约率偏低，需加强邀约话术与到院理由铺垫',
              cv:'整体转化偏低（到诊÷有效），建议全链路复盘'};
    var worst=null, worstGap=0;
    ['pr','br','cv'].forEach(function(k){
      if(!TREND[k]) return;
      var gap=(cur[k]-TREND[k])/TREND[k];   // 负值=低于团队
      if(gap<worstGap-1e-9){ worstGap=gap; worst=k; }
    });
    /* 偏差不足 15% 视为「无明显短板」，避免正常波动被贴标签 */
    if(worst && worstGap<=-0.15){
      r.weak={k:worst, name:names[worst], tip:tips[worst], gap:worstGap};
    } else { r.weak=null; }
  });
  rows.sort(function(a,b){ return b.s.arr - a.s.arr; });

  var h='<div class="toolbar" style="margin-top:0">'+btn('day','当日')+btn('mon','当月')+btn('year','年度')+'</div>';
  /* 客服到诊排名（原龙虎榜） */
  h+=rankCardsHTML(list, month);
  h+='<div class="sec-title"><span class="dot"></span>'+label+' 客服深度绩效 <span class="meta">总转化=到诊÷有效 · 诊断每位客服的漏斗短板</span></div>';
  h+='<div class="panel"><div class="table-wrap"><table class="cs-table"><colgroup>'
    +'<col style="width:13%"><col style="width:8%"><col style="width:8%"><col style="width:9%"><col style="width:8%"><col style="width:9%"><col style="width:8%"><col style="width:9%"><col style="width:9%"><col style="width:10%"><col style="width:9%">'
    +'</colgroup><thead><tr>'
    +'<th>客服</th><th>有效</th><th>转潜</th><th>转潜率</th><th>预约</th><th>预约率</th><th>到诊</th><th>到院率</th><th>总转化</th><th>短板环节</th><th>到诊占比</th>'
    +'</tr></thead><tbody>';
  rows.forEach(function(r){
    var s=r.s;
    var pr=rate(s.val,s.push), br=rate(s.push,s.book), ar=rate(s.book,s.arr);
    /* 短板环节：低于团队均值 ≥15% 的最弱一环；样本不足或无短板则显示达标 */
    var weakTxt;
    if(s.val<5){ weakTxt='<span class="weak-none" title="有效不足 5 条，样本太小不诊断">样本不足</span>'; }
    else if(r.weak){
      weakTxt='<span class="weak-bad" title="'+r.weak.tip+'">'+r.weak.name
        +' <em>'+Math.round(r.weak.gap*100)+'%</em></span>';
    } else { weakTxt='<span class="weak-ok">无明显短板</span>'; }
    h+='<tr><td><b>'+r.st+'</b></td>'
      +'<td>'+s.val.toLocaleString()+'</td>'
      +'<td>'+s.push.toLocaleString()+'</td>'
      +'<td>'+fmtPct(pr)+'</td>'
      +'<td>'+s.book.toLocaleString()+'</td>'
      +'<td>'+fmtPct(br)+'</td>'
      +'<td class="hl">'+s.arr.toLocaleString()+'</td>'
      +'<td>'+fmtPct(ar)+'</td>'
      +'<td class="hl">'+fmtCvrt(s)+'</td>'
      +'<td>'+weakTxt+'</td>'
      +'<td>'+r.share.toFixed(1)+'%</td></tr>';
  });
  var Tpr=rate(T.val,T.push), Tbr=rate(T.push,T.book), Tar=rate(T.book,T.arr);
  h+='</tbody><tfoot><tr><td><b>团队</b></td>'
    +'<td>'+T.val.toLocaleString()+'</td>'
    +'<td>'+T.push.toLocaleString()+'</td>'
    +'<td>'+fmtPct(Tpr)+'</td>'
    +'<td>'+T.book.toLocaleString()+'</td>'
    +'<td>'+fmtPct(Tbr)+'</td>'
    +'<td class="hl">'+T.arr.toLocaleString()+'</td>'
    +'<td>'+fmtPct(Tar)+'</td>'
    +'<td class="hl">'+fmtCvrt(T)+'</td>'
    +'<td>—</td>'
    +'<td>100%</td></tr></tfoot></table></div></div>';

  /* 关键结论（先结论后证据） */
  var best=rows.slice().sort(function(a,b){return b.s.cvrt-a.s.cvrt;})[0];
  var segs=[['转潜率',Tpr],['预约率',Tbr],['到院率',Tar]];
  segs.sort(function(a,b){return a[1]-b[1];});
  var weak=segs[0];
  var top=rows.slice().sort(function(a,b){return b.share-a.share;})[0];
  h+='<div class="fn-summary"><div class="ttl">关键结论</div>';
  h+='<p>转化率冠军：<b>'+best.st+'</b>，总转化 <b>'+fmtCvrt(best.s)+'</b>（到诊÷有效），其话术与跟进节奏可作为团队 SOP 标杆。</p>';
  h+='<p>团队整体最大短板在 <b>'+weak[0]+'</b>（仅 <b>'+weak[1].toFixed(1)+'%</b>），是培训与流程优化的优先环节。</p>';
  if(T.arr>0){
    h+='<p>到诊贡献最集中：<b>'+top.st+'</b> 占团队到诊 <b>'+top.share.toFixed(1)+'%</b>，其工作状态直接影响整体业绩，需重点保障。</p>';
  }
  h+='</div>';

  /* 分渠道客服下钻（原客服数据） */
  h+=channelBreakdownHTML(list, label);

  setView('客服绩效', h);
}

function importJSON(ev){
  var f=ev.target.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var data=JSON.parse(rd.result);
      var arr = Array.isArray(data)? data : (data.records||[]);
      var cs  = Array.isArray(data)? []   : (data.cs||[]);
      var as  = Array.isArray(data)? []   : (data.assets||[]);
      arr=arr.filter(function(r){return r.date&&r.org;}).map(function(r,i){
        return {id:i+1,date:r.date,org:r.org,staff:r.staff||'',tot:+r.tot||0,val:+r.val||0,push:+r.push||0,book:+r.book||0,arr:+r.arr||0};
      });
      cs=cs.filter(function(r){return r.date&&r.staff;}).map(function(r,i){
        return {id:i+1,date:r.date,staff:r.staff,org:r.org||'',tot:+r.tot||0,jt:+r.jt||0,jw:+r.jw||0,val:+r.val||0};
      });
      as=as.filter(function(a){return a&&a.model;}).map(function(a,i){
        return {id:+a.id||(i+1), model:a.model, sn:a.sn||'', status:a.status||'在用'};
      });
      if(!arr.length && !cs.length && !as.length) throw 0;
      if(arr.length){ records=arr; saveData(); }
      if(cs.length){ csRecords=cs; saveCs(); }
      if(as.length){ assets=as; saveAssets(); }

      alert('导入成功：漏斗数据 '+arr.length+' 条，客服数据 '+cs.length+' 条'+(as.length?'，资产 '+as.length+' 条':''));
    }catch(e){ alert('文件格式不正确，导入失败'); }
  };
  rd.readAsText(f); ev.target.value='';
}

/* ==================== 数字滚动增长动画 ==================== */
function parseNum(str){
  var m=str.match(/^([^\d\-]*)(-?[\d.,]+)(.*)$/);
  if(!m || m[2]==='') return null;
  var dec=(m[2].split('.')[1]||'').length;
  return {prefix:m[1], val:parseFloat(m[2].replace(/,/g,'')), suffix:m[3], dec:dec};
}
function fmtN(v,dec){
  return v.toLocaleString('zh-CN',{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function countUp(span,dur){
  var info=parseNum(span.dataset.target);
  if(!info || isNaN(info.val)) return;
  var start=null;
  function frame(ts){
    if(start===null) start=ts;
    var p=Math.min((ts-start)/dur,1);
    var e=1-Math.pow(1-p,3);   // easeOutCubic 缓动
    var cur=info.val*e;
    span.textContent=info.prefix + fmtN(cur, info.dec) + info.suffix;
    if(p<1) requestAnimationFrame(frame);
    else span.textContent=info.prefix + fmtN(info.val, info.dec) + info.suffix;
  }
  requestAnimationFrame(frame);
}
function animateNumbers(root){
  if(!root) return;
  var dur=850;
  /* KPI 卡片：数字可能含 <small> 单位，保留包裹 */
  root.querySelectorAll('.kpi .value').forEach(function(el){
    var m=el.innerHTML.match(/(-?[\d,]+(\.\d+)?)/);
    if(!m) return;
    var pre=el.innerHTML.slice(0,m.index);
    var num=m[0];
    var post=el.innerHTML.slice(m.index+num.length);
    el.innerHTML=pre+'<span class="cnt" data-target="'+num+'">'+num+'</span>'+post;
  });
  /* 龙虎榜数字 */
  root.querySelectorAll('.rank-num').forEach(function(el){
    var txt=el.childNodes[0];
    if(txt && txt.nodeType===3){
      var t=txt.textContent.trim();
      if(/^¥?-?[\d,]+(\.\d+)?(人|%)?$/.test(t)){
        var sp=document.createElement('span');
        sp.className='cnt'; sp.dataset.target=t; sp.textContent=t;
        el.replaceChild(sp, txt);
      }
    }
  });
  /* 表格单元格：静态渲染（避免年度页数百个 td 同时动画造成卡顿） */
  root.querySelectorAll('span.cnt').forEach(function(s){ countUp(s,dur); });
}

/* PWA：注册 Service Worker（仅在 http/https 下，file:// 直接跳过） */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      // 新版本接管后自动刷新一次，确保拿到最新页面（防抖避免循环）
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (!window.__crmReloaded) { window.__crmReloaded = true; location.reload(); }
      });
    }).catch(function(e){ /* 忽略注册失败 */ });
  });
}

/* 一键更新应用：清空 SW 缓存后强制从网络重载页面，彻底绕过 PWA 顽固缓存 */
function updateApp(){
  try{
    if ('caches' in window) {
      caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }).then(function(){ location.reload(); }).catch(function(){ location.reload(); });
    } else { location.reload(); }
  }catch(e){ location.reload(); }
}
</script>

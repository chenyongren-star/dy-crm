function performancePage(rows,f,isStaff){const names=isStaff?(f.staff?[f.staff]:STAFF):(f.org?[f.org]:ORGS),items=group(rows,isStaff?'staff':'org',names),people=isStaff?'<div class="mini-people">'+items.map(r=>'<div class="person-card"><div class="person-card-name"><span>'+esc(r.name)+'</span><span style="color:#9dab94">'+icon('staff')+'</span></div><b class="number">'+fmt(r[metric])+'</b><p class="small">'+LABELS[metric]+' · 当期到诊/有效 '+rate(r.arr,r.val)+'</p></div>').join('')+'</div>':'';return'<section class="panel"><div class="panel-header"><div><p class="panel-number">'+(isStaff?'客服':'渠道')+' / 期间对比</p><h2>'+LABELS[metric]+'表现</h2><p class="small">'+items.length+' 个'+(isStaff?'客服':'渠道')+' · 按所选指标排序</p></div>'+metricPicker()+'</div>'+people+(people?'<div style="height:23px"></div>':'')+table(items,COLS,metric)+'<p class="table-caption">'+RATIO_NOTE+'</p></section>'}
function yearPage(f){const year=f.end.slice(0,4),base=validRows().filter(r=>r.date.startsWith(year)&&(!f.staff||r.staff===f.staff)&&(!f.org||r.org===f.org)),months=[...new Set(base.map(r=>r.date.slice(0,7)))].sort(),items=months.map(m=>({name:m,...sum(base.filter(r=>r.date.startsWith(m)))})),max=Math.max(1,...items.map(r=>r[metric]));return'<section class="panel">'+panelHead('年度 / 月份分布',year+' 年 · '+LABELS[metric],'本页按全年展示；客服和渠道筛选继续生效',metricPicker())+'<div class="year-bars">'+items.map(r=>'<div class="year-item"><b>'+fmt(r[metric])+'</b><div class="year-bar" style="height:'+Math.max(2,r[metric]/max*145)+'px"></div><span>'+Number(r.name.slice(5))+'月</span></div>').join('')+'</div><div style="height:22px"></div>'+table(items,[['val','有效'],['push','推出转潜'],['book','预约'],['arr','到诊'],['cv','当期到诊/有效']],metric)+'<p class="table-caption">上方核心指标按日期筛选；本表按 '+year+' 全年汇总。'+RATIO_NOTE+'</p></section>'}
function profitPage(s,f){const a=f.start.slice(0,7),b=f.end.slice(0,7),months=(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5))+1,people=f.staff?1:STAFF.length,cost=months*people*10000,local=s.arr_local*2100,push=s.arr_push*1050,income=local+push;reportText='DY 日报经营汇总\n'+$('period-label').textContent+'\n有效 '+fmt(s.val)+'，推出转潜 '+fmt(s.push)+'，预约 '+fmt(s.book)+'，到诊 '+fmt(s.arr)+'\n当期到诊/有效 '+rate(s.arr,s.val)+'\n固定模型收入 '+money(income)+'，成本 '+money(cost)+'，差额 '+money(income-cost);return'<section class="finance-hero"><div><p class="eyebrow">固定模型 / 收入减成本</p><div class="number">'+money(income-cost)+'</div><p class="small">'+f.start+' — '+f.end+' · 沿用既定试算参数</p></div><div class="finance-pair"><div><span>估算收入</span><b>'+money(income)+'</b></div><div><span>固定月成本</span><b>'+money(cost)+'</b></div></div></section><div class="rank-grid"><section class="panel">'+panelHead('收入 / 构成','到诊带来的模型收入','','<button id="report" class="text-button" type="button">查看汇总文本 '+icon('diagonal')+'</button>')+'<div class="money-row"><div>本点到诊<small>'+fmt(s.arr_local)+' × ¥2,100</small></div><span class="number">'+money(local)+'</span></div><div class="money-row"><div>推出到诊<small>'+fmt(s.arr_push)+' × ¥1,050</small></div><span class="number">'+money(push)+'</span></div><div class="money-row"><div>合计收入</div><span class="number">'+money(income)+'</span></div></section><section class="panel">'+panelHead('成本 / 假设','看清试算的边界')+'<div class="money-row"><div>固定成本<small>'+people+'人 × '+months+'个月 × ¥10,000</small></div><span class="number">'+money(cost)+'</span></div><p class="model-note">日期范围不足整月时，成本仍按整月计算，不按天折算。<br>本模型不含退款及其他费用。'+(f.org?'<br>当前按渠道筛选收入；成本仍按所选人员计算，未向渠道分摊。':'')+'</p></section></div>'}
function assetsPage(){return'<section class="panel">'+panelHead('本机 / 设备台账','让每一台设备，都有记录','仅保存在当前浏览器；导出备份时一并保存','<span class="pill">'+(backupMode?'备份临时查看':'本机保存')+'</span>')+'<div class="asset-summary"><div><p class="small">台账设备</p><div class="number">'+assets.length+'</div></div><div><p class="small">有备注的设备</p><div class="number">'+assets.filter(a=>a.note||a.remark).length+'</div></div><div><p class="small">存储位置</p><div class="number storage">'+(backupMode?'临时备份':'当前浏览器')+'</div></div></div><form id="asset-form" class="asset-form"><input id="asset-model" aria-label="手机型号" placeholder="手机型号" required maxlength="80"><input id="asset-qty" aria-label="数量" type="number" min="1" max="500" step="1" value="1" required><input id="asset-note" aria-label="备注" placeholder="备注（可选）" maxlength="200"><button class="solid-button" type="submit">新增</button></form><div class="table-wrap"><table class="data-table"><thead><tr><th>编号</th><th>型号</th><th>状态</th><th>备注</th></tr></thead><tbody>'+assets.map(a=>'<tr><td>'+esc(a.sn)+'</td><td>'+esc(a.model)+'</td><td>'+esc(a.status)+'</td><td>'+esc(a.note??a.remark??'')+'</td></tr>').join('')+'</tbody></table></div><p class="table-caption">'+(backupMode?'当前为备份临时查看，新增与修改不会写入本机设置。':'资产不随汇总数据上传到云端。换浏览器或设备时，可通过完整备份临时查看。')+'</p></section>'}
function render(){const f=selection();if(!f.start||!f.end||f.start>f.end){showMessage('开始日期不能晚于结束日期。',true);return}const rows=selected(),s=sum(rows),days=dayCount(f);renderNavigation();$('fresh').textContent='数据截至 '+latest();$('version').textContent='版本 '+data.v;$('period-label').textContent=f.start+' — '+f.end+' · '+(f.staff||'全部客服')+' · '+(f.org||'全部渠道');$('range-note').textContent=days+' 个自然日 · 有效日均 '+fmt(s.val/days)+' 条';renderKpis(rows,s,days);document.querySelectorAll('[data-period]').forEach(b=>{const ld=latest(),begin=b.dataset.period==='day'?ld:b.dataset.period==='year'?ld.slice(0,4)+'-01-01':ld.slice(0,7)+'-01';b.classList.toggle('active',f.end===ld&&f.start===begin)});let html='';if(active==='overview'){const watching=watch(f);html='<div class="dashboard-top">'+trend(rows,f)+goalPanel(f)+'</div><div class="rank-grid">'+staffRanks(rows,f)+channelRanks(rows,f)+'</div>'+(watching?'<div class="insight-grid">'+cohort(s)+watching+'</div>':cohort(s))}else if(active==='staff'||active==='channel')html=performancePage(rows,f,active==='staff');else if(active==='year')html=yearPage(f);else if(active==='profit')html=profitPage(s,f);else if(active==='assets')html=assetsPage();$('view').innerHTML=html;bindView()}
function editGoal(){const month=selection().end.slice(0,7),t=target(month);openDialog('设置 '+month+' 月度目标','<p class="small">'+(backupMode?'当前为临时备份查看，本次修改不保存。':'只调整当前浏览器的目标展示，不修改发布数据。')+'</p><form id="goal-form"><div class="detail-grid">'+[['val','有效线索'],['push','推出转潜'],['book','预约'],['arr','到诊']].map(([k,n])=>'<label>'+n+'<input name="'+k+'" type="number" min="0" step="1" required value="'+Number(t[k])+'"></label>').join('')+'</div><div class="dialog-actions"><button class="solid-button" type="submit">保存目标</button></div></form>');$('goal-form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));if(Object.values(values).some(v=>!Number.isInteger(+v)||+v<0))return;const all=currentTargets();all[month]=Object.fromEntries(Object.entries(values).map(([k,v])=>[k,+v]));if(backupMode?(backupTargets=all,true):saveStore('dy_target_v1',all)){$('dialog').close();render()}}}
function bindView(){if($('metric'))$('metric').onchange=e=>{metric=e.target.value;render()};if($('edit-goal'))$('edit-goal').onclick=editGoal;if($('report'))$('report').onclick=()=>{openDialog('经营汇总文本','<textarea readonly aria-label="经营汇总文本" id="report-text"></textarea>');$('report-text').value=reportText};if($('asset-form'))$('asset-form').onsubmit=e=>{e.preventDefault();const model=$('asset-model').value.trim(),qty=+$('asset-qty').value,note=$('asset-note').value.trim();if(!model||!Number.isInteger(qty)||qty<1||qty>500){showMessage('数量须为1至500的整数。',true);return}const next=Math.max(0,...assets.map(a=>+a.id||0))+1,updated=assets.concat(Array.from({length:qty},(_,i)=>({id:next+i,sn:'DY-SJ-'+String(next+i).padStart(3,'0'),model,status:'在用',note})));if(backupMode||saveStore('wb_medicrm_assets_v1',updated)){assets=updated;render()}}}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});
$('kpis').addEventListener('click',e=>{const b=e.target.closest('[data-detail]');if(b)openMetric(b.dataset.detail)});
$('view').addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-trend],[data-chart-date],[data-select-staff],[data-select-org]');if(!b)return;if(b.dataset.go)navigate(b.dataset.go);else if(b.dataset.trend){trendMetric=b.dataset.trend;render()}else if(b.dataset.chartDate)openMetric(trendMetric,b.dataset.chartDate);else if(b.dataset.selectStaff){$('staff').value=b.dataset.selectStaff;navigate('staff')}else if(b.dataset.selectOrg){$('channel').value=b.dataset.selectOrg;navigate('channel')}});
$('view').addEventListener('keydown',e=>{const b=e.target.closest('[data-chart-date]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openMetric(trendMetric,b.dataset.chartDate)}});
$('close-dialog').onclick=()=>$('dialog').close();
$('filters').onsubmit=e=>{e.preventDefault();showMessage(backupMode?'正在临时查看备份；刷新后回到发布快照。':'');render()};
document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>setPeriod(b.dataset.period));
$('reset-filters').onclick=()=>{initFilters();render()};
function download(name,obj){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=()=>download('DY日报完整备份_'+today()+'.json',{schemaVersion:1,exportedAt:new Date().toISOString(),seed:data,assets,targets:currentTargets(),sourceMode:backupMode?'local-preview':'published'});
$('open-backup').onclick=()=>$('backup-file').click();
$('backup-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text()),candidate=incoming.seed||(Array.isArray(incoming.records)?{v:'local-backup',records:incoming.records,cs:incoming.cs||[]}:null);if(!candidate||!Array.isArray(candidate.records)||!Array.isArray(candidate.cs))throw Error('文件缺少records/cs');candidate.records.forEach(r=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||Number.isNaN(Date.parse(r.date+'T12:00:00Z'))||new Date(r.date+'T12:00:00Z').toISOString().slice(0,10)!==r.date||!r.org||!r.staff||FIELDS.some(k=>r[k]!=null&&(!Number.isFinite(r[k])||r[k]<0)))throw Error('日期、数据结构或数字无效')});if(incoming.assets!=null&&(!Array.isArray(incoming.assets)||incoming.assets.some(a=>!a||typeof a.model!=='string'||!Number.isFinite(+a.id))))throw Error('资产结构无效');if(incoming.targets!=null&&(typeof incoming.targets!=='object'||Array.isArray(incoming.targets)||Object.values(incoming.targets).some(t=>!t||typeof t!=='object'||Object.values(t).some(v=>!Number.isFinite(v)||v<0))))throw Error('目标结构无效');data=candidate;assets=incoming.assets??structuredClone(initialAssets);backupTargets=incoming.targets??{};backupMode=true;initFilters();showMessage('正在临时查看备份，包含全部统计字段、资产和目标；本次修改不保存，刷新回到发布快照。');render()}catch(err){showMessage('备份未打开：'+err.message,true)}finally{e.target.value=''}};
async function checkUpdate(){if(backupMode){data=published;backupMode=false;backupTargets=null;assets=readStore('wb_medicrm_assets_v1',structuredClone(initialAssets));initFilters();showMessage('已回到当前发布快照。');render();return}if(['127.0.0.1','localhost'].includes(location.hostname)){showMessage('视觉重设计预览 · 真实汇总快照 · 尚未替换线上页面');return}if(location.protocol==='file:'){showMessage('当前为本地文件版本。自动入库更新文件后，重新打开可查看最新数据。');return}try{const r=await fetch('ver.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const v=await r.json();if(v.v&&v.v!==published.v){showMessage('发现新版本，正在加载。');location.reload()}else showMessage('当前已是最新发布版本。')}catch{showMessage('暂时无法检查更新，继续显示已加载的数据。',true)}}
$('refresh').onclick=checkUpdate;
const initialPage=location.hash.slice(1);if(PAGES.some(p=>p[0]===initialPage))active=initialPage;
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(PAGES.some(page=>page[0]===p)&&active!==p){active=p;render()}});
matchMedia('(max-width:720px)').addEventListener('change',()=>render());
initFilters();render();
if(location.protocol.startsWith('http')){if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});checkUpdate();window.addEventListener('focus',()=>{if(!backupMode)checkUpdate()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!backupMode)checkUpdate()})}
})();
</script>
</body>
</html>
